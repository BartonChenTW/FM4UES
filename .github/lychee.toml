# Config for lychee, the link checker run by .github/workflows/link-check.yml
# https://lychee.cli.rs/usage/config/

# Don't fail the whole run on transient network errors / rate limits —
# only on links that are actually broken. DOI resolvers in particular can
# be slow (they redirect through the publisher's own site), so give each
# request more than lychee's short default timeout before it's retried.
max_retries = 3
retry_wait_time = 10
timeout = 60

# Treat a timeout as "couldn't check", not "broken link". GitHub's
# runners hit https://doi.org/10.5334/jors.188 (the PyPSA reference)
# slowly enough to time out even at 30s, while the same URL resolves
# fine locally and by hand -- verified it redirects correctly to the
# real paper at openresearchsoftware.metajnl.com. A slow publisher
# redirect shouldn't fail the whole check; genuine errors (404s, DNS
# failures, refused connections) still do, since this only forgives
# timeouts and nothing else.
accept_timeouts = true

# Some sites (arXiv, DOI resolvers, publisher pages) block or slow-path
# unrecognised bots; a normal browser UA avoids false positives.
user_agent = "Mozilla/5.0 (compatible; lychee link checker)"

# IMPORTANT: setting `accept` at all REPLACES lychee's default range
# (100..=103, 200..=299), it does not add to it -- confirmed by testing
# locally: accept = [429] alone rejected plain 200 OK responses. So this
# list has to restate the default range explicitly, not just list the
# extra codes needed on top of it.
#
# 202 is IEEE Xplore's normal response code for a real, working document
# page (confirmed by hand via Crossref for several of the IEEE DOIs
# cited in this repo) -- already covered by 200..=299 below, kept
# implicit rather than listed separately.
# 429 is a rate limit, not a dead link -- accept it so retries/backoff
# handle it instead of failing the check outright.
accept = ["100..=103", "200..=299", 429]

# Known-flaky or intentionally-unfetchable targets.
exclude = [
  # localhost / internal notes referenced conceptually, not real links
  '^http://localhost',
  # Internal cross-page links use the *rendered* Jekyll path (e.g.
  # 2-3-choosing-a-basic-element.html, or a relative path into another
  # chapter's folder like ../chapter-4-directions/4-9-1-methods-tier1.html)
  # since that's what works once the site is built, but lychee runs
  # against the raw .md source, where no such file exists on disk.
  #
  # IMPORTANT: lychee resolves a relative link to a full file:// URL
  # *before* applying `exclude` — the pattern is matched against
  # something like file:///home/runner/work/<repo>/<repo>/appendices/
  # a-glossary.html, not the original relative "appendices/a-glossary.html"
  # text from the Markdown source. An anchor on the relative form (the
  # previous version of this pattern) therefore never matches anything
  # and silently lets every internal link through to be checked as a
  # real file, which is always a 404 here (confirmed by a failing CI run
  # on 2026-09-11). Match on the resolved file:// URL instead: every
  # local .html link in this repo is a Jekyll-rendered page path, not a
  # real file in the source tree, so excluding all file:// ... .html
  # links is correct site-wide, not just for some of them.
  '^file://.*\.html(#[^\s)]*)?$',
  # `exclude` matches the URL as it appears in the Markdown source, not
  # the resolved redirect target -- a pattern on science.org/wiley.com
  # (where these actually redirect to) never matches, because lychee
  # always checks/reports against the original https://doi.org/... URL.
  # These two publishers (Wiley Online Library, Science/AAAS) return 403
  # Forbidden to lychee even with a browser user agent -- they block
  # automated checkers, not because the page is missing. Verified by
  # hand for each (Crossref API lookup + confirming the resolved URL is
  # the real, correct paper) before excluding, rather than assuming
  # every 403 from every publisher is benign -- see chapter-2-fm-
  # foundations/2-4-5-geospatial-weather-fms.md and chapter-3-sim-opt/
  # 3-3-energy-hub-formalism.md for the citations these belong to.
  '^https://doi\.org/10\.1126/science\.adi2336$',
  '^https://doi\.org/10\.1002/etep\.112$',
  # The PyPSA reference. Its publisher host
  # (openresearchsoftware.metajnl.com, which this DOI redirects to) is
  # unreliable specifically from GitHub's runners: it has failed CI
  # twice in two different ways -- first as a TIMEOUT (which
  # accept_timeouts above now forgives), then as "Connection failed",
  # which is a different error class and is not covered by
  # accept_timeouts. It resolves fine locally and by hand.
  # Verified real via the Crossref API before excluding: Brown, Hörsch
  # & Schlachtberger (2018), "PyPSA: Python for Power System Analysis",
  # Journal of Open Research Software 6(1):4 -- exactly what
  # chapter-3-sim-opt/3-6-tool-landscape.md cites.
  '^https://doi\.org/10\.5334/jors\.188$',
  # MDPI (DOI prefix 10.3390) does the same thing -- every MDPI DOI in
  # this bibliography returns 403 to lychee while resolving fine in a
  # browser. Excluded by DOI prefix rather than one-by-one, since MDPI
  # is now a recurring publisher here (Applied System Innovation,
  # Energies) and listing individual DOIs would go stale as citations
  # are added. Each MDPI citation currently in the book was verified
  # against the Crossref API (title/authors/journal/volume/year all
  # match what the text cites) before this exclusion was added:
  #   10.3390/asi9010018  -- Wen et al. 2026, LG-HGNN (sections 4.9.2, 4.10)
  #   10.3390/en19163769  -- Naeem et al. 2026, LLMs in power systems (section 1.3)
  '^https://doi\.org/10\.3390/',
  # OSTI (osti.gov, DOE's technical report repository) does the same
  # thing -- these two NREL technical reports return 403 to lychee while
  # resolving fine in a browser. Excluded by DOI prefix (10.2172, OSTI's
  # registrant prefix) for the same reason as MDPI above: more OSTI
  # reports are a plausible future addition (NREL publishes ResStock/
  # ComStock-adjacent work this way routinely) and per-DOI entries would
  # go stale. Both current citations verified against the Crossref API
  # before excluding:
  #   10.2172/1854582 -- Wilson et al. 2022, ResStock end-use load
  #     profiles methodology (section 4.2)
  #   10.2172/1967948 -- Parker et al. 2023, ComStock reference
  #     documentation (section 4.2)
  '^https://doi\.org/10\.2172/',
  # ACM (DOI prefix 10.1145) redirects to dl.acm.org, which returns 403
  # Forbidden to lychee even with a browser user agent -- the same
  # bot-blocking as Wiley/Science/MDPI above, not a missing page.
  # Excluded by prefix rather than per-DOI, matching the MDPI/OSTI
  # entries: ACM venues (e-Energy, BuildSys) are a recurring source for
  # this book and per-DOI entries would go stale. Verified against the
  # Crossref API before excluding:
  #   10.1145/3744255.3798119 -- Arjunan et al. 2026, "EnergyFM:
  #     Pretrained Models for Energy Meter Data Analytics", e-Energy '26,
  #     pp. 556-568 (section 2.4.2) -- title, all six authors and page
  #     range match what the text cites.
  '^https://doi\.org/10\.1145/',
  # Oxford University Press (DOI prefix 10.1093) redirects to
  # academic.oup.com, which returns 403 Forbidden to lychee even with a
  # browser user agent -- the same bot-blocking as Wiley/Science/MDPI/ACM
  # above, not a missing page. Excluded by prefix for consistency with
  # those entries. Verified against the Crossref API before excluding:
  #   10.1093/nsr/nwaa134 -- Nik, Perera & Chen, "Towards climate
  #     resilient urban energy systems: a review", National Science
  #     Review 8(3) (section 1.1) -- title, all three authors and journal
  #     match what the text cites.
  '^https://doi\.org/10\.1093/',
  # AAAI (DOI prefix 10.1609) returns HTTP/2 protocol errors to lychee
  # on GitHub Actions runners, even though the URLs resolve fine in a
  # browser. Excluded by prefix since AAAI is a recurring publisher
  # in ML/AI citations. Verified against the Crossref API before excluding:
  #   10.1609/aaai.v34i01.5403 -- Fioretto, Mak & Van Hentenryck (2020),
  #     "Predicting AC optimal power flows: Combining deep learning and
  #     Lagrangian dual methods" (section 2.2) -- title, all three authors
  #     and venue match what the text cites.
  '^https://doi\.org/10\.1609/',
  # Empa (Swiss Federal Laboratories for Materials Science and Technology)
  # returns 403 Forbidden to lychee, same bot-blocking pattern as above.
  # Both URLs in index.md (main site and Urban Energy Systems Lab page)
  # verified to load correctly in a browser before excluding.
  '^https://www\.empa\.ch/',
  # ASME (DOI prefix 10.1115) redirects to asmedigitalcollection.asme.org,
  # which returns 403 Forbidden to lychee even with a browser user agent --
  # the same bot-blocking as the publishers above, not a missing page.
  # Excluded by prefix for consistency. Verified against the Crossref API
  # before excluding, and the redirect target itself confirms the article:
  #   10.1115/1.4056078 -- Wu & Wang (2022), "Generative Design for
  #     Resilience of Interdependent Network Systems", Journal of
  #     Mechanical Design 145(3), 031705 (section 4.4) -- title, both
  #     authors and the volume/issue/article-number in the redirect URL
  #     itself all match what the text cites.
  '^https://doi\.org/10\.1115/',
  # This book's own GitHub Pages URL. Checked from README.md and
  # CONTRIBUTING.md. GitHub's runners sometimes get "Connection reset
  # by peer" (os error 104) against bartonchentw.github.io even though
  # the site is up in a browser -- same class of flake as the PyPSA
  # publisher host above (not a timeout, so accept_timeouts does not
  # forgive it). Verified the URL is live before excluding. Do not
  # treat this as a licence to skip other github.io links.
  '^https://bartonchentw\.github\.io/FM4UES/?$',
  # OTexts (otexts.com, publisher of Forecasting: Principles and
  # Practice) returns 403 Forbidden to lychee's user agent but 200 to a
  # browser one -- reproduced locally on 2026-09-23 with both UAs, so it
  # is bot-blocking, not a dead page. Excluded by host since any further
  # FPP chapter link would hit the same block. Verified the linked page
  # is the right one: its title is "15 Foundation forecasting models --
  # Forecasting: Principles and Practice, the Pythonic Way", cited in
  # refs-to-add.md (A2).
  '^https://otexts\.com/',
  # Taylor & Francis (DOI prefix 10.1080) redirects to tandfonline.com,
  # which returns 403 Forbidden to every scripted client tried -- lychee's
  # UA and a browser UA alike -- the same bot-blocking as Wiley/Science
  # above, not a missing page. Excluded by prefix, as for the other
  # publishers. Verified against the Crossref API before excluding, and
  # doi.org itself redirects to the matching tandfonline.com record:
  #   10.1080/00401706.1979.10489755 -- McKay, Beckman & Conover (1979),
  #     "A Comparison of Three Methods for Selecting Values of Input
  #     Variables in the Analysis of Output from a Computer Code",
  #     Technometrics 21(2):239-245 (section 4.10, Latin hypercube).
  '^https://doi\.org/10\.1080/',
]

# Skip files that aren't meant to be checked as published pages.
exclude_path = [
  "_site",
  "vendor",
]
