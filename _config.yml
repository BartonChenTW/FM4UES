title: Foundation Models for Urban Energy Systems
description: >-
  A working textbook on what gets simulated in urban energy systems,
  what could plausibly be learned by a foundation model, and how to build it.
baseurl: "/FM4UES"
url: ""

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from

color_scheme: light
search_enabled: true
heading_anchors: true

nav_sort: case_insensitive

# just-the-docs Mermaid support, for the diagrams in chapter landing pages
# and the token-schema / temporal-hierarchy sections.
mermaid:
  version: "11.4.1"

# Files kept in the repo but not built into the site
exclude:
  - TODO.md
  - outline.md
  - log.md
  - notes-concept-paper.md
  - diagram-ideas.md
  - refs-to-add.md
  - references/fm-for-ues.bib
  - Gemfile
  - Gemfile.lock
  - vendor/

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Working textbook, actively revised. Corrections and additions welcome via issue or PR."

# Current book version, shown under the site title in the sidebar
# (_includes/title.html) and on the home page. Change it here, and in
# README.md's Status section, when releasing a version (CONTRIBUTING.md).
book_version: "2.2"
book_version_date: "2 October 2026"

# Source repository: just-the-docs uses these for the "Edit this page on
# GitHub" footer link, and _includes/page-status.html uses them for each
# page's "Page history" link (the GitHub commit list for that file).
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/BartonChenTW/FM4UES"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Caution
    color: yellow
  important:
    title: Important
    color: red
