# Institutions behind the foundation-model publications cited in the notes:
# the source for Appendix E (appendices/e-research-institutes.md).
#
# Compiled on 2026-10-27, starting from the authors of every publication in
# references/fm-for-ues.bib that builds, pretrains, adapts or evaluates a
# foundation model, LLMs and LLM agents included (143 entries). Affiliations come
# from each paper's OpenAlex record (author institutions, checked against the
# raw affiliation strings), or from the paper's own title page where OpenAlex
# had none; for a model card or README with no author list, the developer it
# names. Institutions are counted at organisation level: departments, campuses
# and national subsidiaries are merged (e.g. IBM Research Zurich, Ireland, India
# and Yorktown are "IBM Research").
#
# Left out because no affiliation could be verified from the paper:
# shirzadi2026necbagents, ball2026openstudiomcp (publisher page blocked, no
# preprint) and wang2026pufibara (no stated affiliation).
#
# Each paper links to the page whose footnotes cite it. Entries are sorted by
# number of papers, then name. When adding a reference, add its key to every
# institution in its author list.

