# Named models in the book: the source for Appendix D (appendices/d-model-index.md)
# and for the hover cards on model links (_includes/footnote-tooltip.html).
# Every field comes from the model's paper or official page; `sources` lists
# the pages checked. Leave a field empty rather than guess. Entries were
# compiled and checked on 2026-10-01.

# --- General time series ---
- id: "chronos"
  name: "Chronos"
  full_name: "Chronos"
  family: "General time series"
  developer: "Amazon"
  year: 2024
  description: "Scales and quantises series values into a fixed token vocabulary, then trains T5 language-model architectures on them with cross-entropy loss."
  url: "https://github.com/amazon-science/chronos-forecasting"
  paper: "https://arxiv.org/abs/2403.07815"
  bib_key: "ansari2024chronos"
  sources:
    - "https://export.arxiv.org/api/query?id_list=2403.07815"
    - "https://arxiv.org/html/2403.07815"
    - "https://github.com/amazon-science/chronos-forecasting"
    - "https://huggingface.co/amazon/chronos-t5-large"
  notes: "Paper affiliations are mainly AWS AI Labs and Amazon Supply Chain Optimization Technologies, with some co-authors also at universities (UC San Diego, Freiburg, Rutgers, UC Berkeley, NYU); the paper states the work was performed at Amazon."
- id: "chronos-bolt"
  name: "Chronos-Bolt"
  full_name: "Chronos-Bolt"
  family: "General time series"
  developer: "Amazon"
  year: 2024
  description: "Patch-based Chronos variant; a T5 encoder-decoder reads context patches and directly outputs multi-step quantile forecasts, much faster than original Chronos."
  url: "https://huggingface.co/amazon/chronos-bolt-base"
  paper: ""
  bib_key: ""
  sources:
    - "https://huggingface.co/amazon/chronos-bolt-base"
    - "https://github.com/amazon-science/chronos-forecasting"
    - "https://aws.amazon.com/blogs/machine-learning/fast-and-accurate-zero-shot-forecasting-with-chronos-bolt-and-autogluon/"
  notes: "The book does not mention Chronos-Bolt anywhere (no chapter text, footnote or bib entry). No dedicated paper exists; it is documented in the HF model card, the Chronos README (released 26 Nov 2024) and an AWS blog post dated 2 Dec 2024. Sizes 9M-205M parameters."
