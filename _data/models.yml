# --- Energy ---
- id: "gridfm"
  name: "GridFM"
  full_name: "Grid Foundation Model"
  family: "Energy"
  developer: "IBM Research, ETH Zürich, Hydro-Québec and partners"
  year: 2024
  description: "Graph neural network foundation model for power flow, pretrained by reconstructing masked bus variables with a loss enforcing the power-flow equations."
  url: "https://github.com/gridfm/gridfm-graphkit"
  paper: "https://doi.org/10.1016/j.joule.2024.11.002"
  bib_key: "hamann2024foundation"
  sources:
    - "https://api.crossref.org/works/10.1016/j.joule.2024.11.002"
    - "https://arxiv.org/abs/2407.09434"
    - "https://arxiv.org/html/2407.09434v2"
    - "https://github.com/gridfm/gridfm-graphkit"
    - "https://lfenergy.org/projects/opengridfm/"
  notes: ">- The book writes both \"GridFM\" and \"GridFM-v0\". In the cited Joule paper (arXiv 2407.09434) GridFM-v0 is a proposed near-term roadmap model (MAE pre-training on masked node features, loss = scaled cosine error + power-flow term); the paper does not release weights. The implementation is gridfm-graphkit (GitHub org \"gridfm\", first release v0.0.1 June 2025), whose README now asks users to cite a different paper, GENCO (arXiv 2608.09921), which is not in the bib. No Hugging Face page named \"GridFM-v0\" was found; HF org \"gridfm\" hosts 2026 GENCO checkpoints. Crossref has no affiliations for this DOI; developer is taken from the arXiv v2 author block (most frequent: Hydro-Québec, IBM Research, NREL, ETH Zürich, Argonne). The book's specific claim (2-2-five-design-decisions.md) that GridFM-v0 uses a float discretisation-and-tokenisation scheme from vision-language-action models was not checked here."
